<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="BridgeVLA++ logo">
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#1E1C19"/>
  <!-- bridge deck -->
  <rect x="18" y="66" width="92" height="8" rx="4" fill="#FAF9F7"/>
  <!-- arch -->
  <path d="M22 66 C 34 34, 94 34, 106 66" fill="none" stroke="#FAF9F7" stroke-width="7" stroke-linecap="round"/>
  <!-- hangers -->
  <g stroke="#FAF9F7" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="40" y1="48" x2="40" y2="66"/>
    <line x1="64" y1="41" x2="64" y2="66"/>
    <line x1="88" y1="48" x2="88" y2="66"/>
  </g>
  <!-- piers -->
  <g fill="#FAF9F7" opacity="0.88">
    <rect x="26" y="74" width="9" height="24" rx="4"/>
    <rect x="93" y="74" width="9" height="24" rx="4"/>
  </g>
  <!-- plus plus, in the accent orange -->
  <g fill="#ED7D31">
    <rect x="46" y="86" width="16" height="5" rx="2.5"/>
    <rect x="51.5" y="80.5" width="5" height="16" rx="2.5"/>
    <rect x="68" y="86" width="16" height="5" rx="2.5"/>
    <rect x="73.5" y="80.5" width="5" height="16" rx="2.5"/>
  </g>
</svg>
