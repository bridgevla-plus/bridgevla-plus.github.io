<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="BridgeVLA++ logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f6ae0"/>
      <stop offset="55%" stop-color="#6f5ad6"/>
      <stop offset="100%" stop-color="#9c5ec8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#dfe6ff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#g)"/>
  <!-- bridge deck -->
  <rect x="18" y="66" width="92" height="8" rx="4" fill="url(#g2)"/>
  <!-- arch -->
  <path d="M22 66 C 34 34, 94 34, 106 66" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
  <!-- hangers -->
  <g stroke="url(#g2)" stroke-width="4" stroke-linecap="round" opacity="0.92">
    <line x1="40" y1="48" x2="40" y2="66"/>
    <line x1="64" y1="41" x2="64" y2="66"/>
    <line x1="88" y1="48" x2="88" y2="66"/>
  </g>
  <!-- piers -->
  <g fill="url(#g2)" opacity="0.9">
    <rect x="26" y="74" width="9" height="24" rx="4"/>
    <rect x="93" y="74" width="9" height="24" rx="4"/>
  </g>
  <!-- plus plus -->
  <g fill="#ffffff">
    <rect x="46" y="86" width="16" height="5" rx="2.5"/>
    <rect x="51.5" y="80.5" width="5" height="16" rx="2.5"/>
    <rect x="68" y="86" width="16" height="5" rx="2.5"/>
    <rect x="73.5" y="80.5" width="5" height="16" rx="2.5"/>
  </g>
</svg>
